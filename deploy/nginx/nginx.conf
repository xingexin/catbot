server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 102m;
  # Re-resolve the service after Compose replaces backend with a new container IP.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $secretary_backend http://backend:8080;
  location /internal/ { return 404; }
  location /api/ {
    proxy_pass $secretary_backend;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3700s;
  }
  location = /qq/webhook {
    proxy_pass $secretary_backend;
    proxy_set_header Host $http_host;
  }
  location = /qq/onebot/events {
    proxy_pass $secretary_backend;
    proxy_set_header Host $http_host;
  }
  location / { try_files $uri $uri/ /index.html; }
}
