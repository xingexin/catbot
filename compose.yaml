name: ${COMPOSE_PROJECT_NAME:-catbot}
services:
  postgres:
    image: postgres:17.6
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: secretary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python3 scripts/init-env.py}
      POSTGRES_DB: secretary
    ports: ["127.0.0.1:5442:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretary -d secretary"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: secretary
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DEFAULT_NAMESPACE: default
    ports: ["127.0.0.1:7233:7233"]
    healthcheck:
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "127.0.0.1:7233",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  runtime:
    build: { context: ., target: runtime }
    environment:
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:?run python3 scripts/init-env.py}
      CODEBUDDY_INTERNET_ENVIRONMENT: ${CODEBUDDY_INTERNET_ENVIRONMENT:-}
    volumes: [sdk:/app/data]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8091/health',{headers:{Authorization:'Bearer '+process.env.RUNTIME_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 10
    restart: unless-stopped
  backend:
    build: { context: ., target: backend }
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }
      runtime: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://secretary:${POSTGRES_PASSWORD}@postgres:5432/secretary?sslmode=disable
      # This is a single Compose service, not a gRPCLB/SRV endpoint. Docker's
      # upstream DNS can stall on SRV queries even while its A record is healthy.
      TEMPORAL_ADDRESS: passthrough:///temporal:7233
      INTERNAL_URL: http://backend:8080
      RUNTIME_URL: http://runtime:8091
      MASTER_KEY: ${MASTER_KEY:?run python3 scripts/init-env.py}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run python3 scripts/init-env.py}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_SECRET: ${QQ_SECRET:-}
      QQ_USER_OPENID: ${QQ_USER_OPENID:-}
      QQ_CONFIG_ID: ${QQ_CONFIG_ID:-}
      QQ_PERSONA_ID: ${QQ_PERSONA_ID:-secretary}
      QQ_BASE_URL: ${QQ_BASE_URL:-https://api.bot.qq.com}
      NAPCAT_ENABLED: ${NAPCAT_ENABLED:-true}
      ONEBOT_URL: ${ONEBOT_URL-http://napcat:3000}
      ONEBOT_TOKEN: ${ONEBOT_TOKEN:-}
      NAPCAT_WEB_URL: http://localhost:${NAPCAT_WEB_PORT:-6099}/webui
    volumes: [app-data:/app/data]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      retries: 10
    restart: unless-stopped
  web:
    build: { context: ., target: web }
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    restart: unless-stopped
  napcat:
    profiles: [napcat]
    image: mlikiowa/napcat-docker:v4.18.28
    hostname: ${COMPOSE_PROJECT_NAME:-catbot}-qq
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
    ports: ["127.0.0.1:${NAPCAT_WEB_PORT:-6099}:6099"]
    volumes:
      - napcat-qq:/app/.config/QQ
      - ./data/napcat/config:/app/napcat/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6099/webui/"]
      interval: 10s
      start_period: 30s
      retries: 15
    restart: unless-stopped
volumes:
  postgres:
  app-data:
  sdk:
  napcat-qq:
